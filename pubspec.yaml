name: deshexplorer
description: "DeshExplorer – Smart Travel Guide & Trip Planner for Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ----- State Management -----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ----- Routing -----
  go_router: ^14.2.0

  # ----- Firebase -----
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.4
  firebase_storage: ^11.7.6
  firebase_messaging: ^14.9.3

  # ----- Google Sign In -----
  google_sign_in: ^6.2.1

  # ----- Maps & Location -----
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # ----- Local Storage -----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # ----- Networking -----
  dio: ^5.4.3+1

  # ----- Images -----
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # ----- UI / UX helpers -----
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  equatable: ^2.0.5
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/destinations/
    - assets/images/hotels/
    - assets/images/onboarding/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/logo.png.png"

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
